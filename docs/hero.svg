<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#d9d1c4"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b5ada3"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="#f7f4ef"/>

  <!-- Title -->
  <text x="48" y="70" font-size="34" font-weight="700" fill="#3d342b">Canvas Quick Mindmap</text>
  <text x="48" y="104" font-size="18" fill="#7a6e62">Keyboard-first mind maps on Obsidian Canvas — no new file format, just your canvas.</text>

  <!-- Canvas panel -->
  <rect x="40" y="132" width="780" height="628" rx="14" fill="#fbf9f6" stroke="#e3dccf"/>
  <rect x="40" y="132" width="780" height="628" rx="14" fill="url(#dots)"/>

  <!-- Search bar -->
  <g filter="url(#shadow)">
    <rect x="250" y="152" width="400" height="44" rx="10" fill="#ffffff" stroke="#e3dccf"/>
  </g>
  <circle cx="276" cy="173" r="7" fill="none" stroke="#9a8f83" stroke-width="2"/>
  <line x1="281" y1="178" x2="286" y2="183" stroke="#9a8f83" stroke-width="2" stroke-linecap="round"/>
  <text x="298" y="180" font-size="17" fill="#3d342b">design</text>
  <text x="560" y="180" font-size="15" fill="#9a8f83">1 / 1</text>
  <text x="604" y="180" font-size="16" fill="#9a8f83">↑ ↓</text>

  <!-- Edges -->
  <g fill="none" stroke="#b5ada3" stroke-width="2.2" marker-end="url(#arrow)">
    <path d="M220,456 C300,456 260,316 328,316"/>
    <path d="M220,456 C290,456 290,456 328,456"/>
    <path d="M220,456 C300,456 260,596 328,596"/>
    <path d="M450,456 C530,456 500,406 558,406"/>
    <path d="M450,456 C530,456 500,506 558,506"/>
  </g>

  <!-- Nodes -->
  <g font-size="17" fill="#3d342b">
    <rect x="80" y="431" width="140" height="50" rx="8" fill="#f1ece4" stroke="#cfc6b8"/>
    <text x="102" y="462">Project ideas</text>

    <rect x="330" y="291" width="120" height="50" rx="8" fill="#f1ece4" stroke="#cfc6b8"/>
    <text x="352" y="322">Research</text>

    <!-- search hit -->
    <rect x="326" y="427" width="128" height="58" rx="11" fill="none" stroke="#f3d77a" stroke-width="5"/>
    <rect x="330" y="431" width="120" height="50" rx="8" fill="#f1ece4" stroke="#8a6f4e" stroke-width="2"/>
    <text x="358" y="462">Design</text>

    <rect x="330" y="571" width="120" height="50" rx="8" fill="#f1ece4" stroke="#cfc6b8"/>
    <text x="358" y="602">Launch</text>

    <rect x="560" y="381" width="140" height="50" rx="8" fill="#f1ece4" stroke="#cfc6b8"/>
    <text x="580" y="412">Wireframes</text>

    <!-- selected node with + buttons -->
    <rect x="560" y="481" width="104" height="50" rx="8" fill="#f1ece4" stroke="#8a6f4e" stroke-width="2.5"/>
    <text x="582" y="512">Colors</text>
  </g>
  <g filter="url(#shadow)">
    <circle cx="690" cy="506" r="12" fill="#ffffff" stroke="#d6cdbf"/>
    <circle cx="612" cy="557" r="12" fill="#ffffff" stroke="#d6cdbf"/>
  </g>
  <g stroke="#7a6e62" stroke-width="2" stroke-linecap="round">
    <line x1="684" y1="506" x2="696" y2="506"/><line x1="690" y1="500" x2="690" y2="512"/>
    <line x1="606" y1="557" x2="618" y2="557"/><line x1="612" y1="551" x2="612" y2="563"/>
  </g>
  <text x="708" y="511" font-size="14" fill="#9a8f83">child</text>
  <text x="632" y="562" font-size="14" fill="#9a8f83">sibling</text>

  <!-- Toolbar on the right edge of the canvas -->
  <g filter="url(#shadow)">
    <rect x="768" y="300" width="36" height="76" rx="8" fill="#ffffff" stroke="#e3dccf"/>
  </g>
  <circle cx="785" cy="318" r="6" fill="none" stroke="#7a6e62" stroke-width="2"/>
  <line x1="789" y1="322" x2="793" y2="326" stroke="#7a6e62" stroke-width="2" stroke-linecap="round"/>
  <g stroke="#7a6e62" stroke-width="2" stroke-linecap="round">
    <line x1="778" y1="348" x2="778" y2="364"/><line x1="778" y1="350" x2="794" y2="350"/>
    <line x1="784" y1="357" x2="794" y2="357"/><line x1="784" y1="364" x2="794" y2="364"/>
  </g>
  <text x="732" y="292" font-size="13" fill="#9a8f83">search · tidy</text>

  <!-- Feature list -->
  <g font-size="17" fill="#3d342b">
    <g transform="translate(860,160)">
      <text font-size="14" font-weight="700" fill="#9a8f83" letter-spacing="1">WHILE TYPING</text>
      <rect x="0" y="18" width="62" height="30" rx="6" fill="#ffffff" stroke="#cfc6b8"/><text x="11" y="39" font-size="15">Enter</text>
      <text x="76" y="39">new child node</text>
      <rect x="0" y="58" width="62" height="30" rx="6" fill="#ffffff" stroke="#cfc6b8"/><text x="17" y="79" font-size="15">Tab</text>
      <text x="76" y="79">new sibling node</text>
      <rect x="0" y="98" width="62" height="30" rx="6" fill="#ffffff" stroke="#cfc6b8"/><text x="6" y="119" font-size="13">⇧ Enter</text>
      <text x="76" y="119">line break</text>
    </g>
    <g transform="translate(860,320)">
      <text font-size="14" font-weight="700" fill="#9a8f83" letter-spacing="1">NODE SELECTED</text>
      <rect x="0" y="18" width="62" height="30" rx="6" fill="#ffffff" stroke="#cfc6b8"/><text x="11" y="39" font-size="15">Enter</text>
      <text x="76" y="39">edit it</text>
      <rect x="0" y="58" width="62" height="30" rx="6" fill="#ffffff" stroke="#cfc6b8"/><text x="17" y="79" font-size="15">Tab</text>
      <text x="76" y="79">new child node</text>
      <rect x="0" y="98" width="62" height="30" rx="6" fill="#ffffff" stroke="#cfc6b8"/><text x="15" y="119" font-size="15">⌘ F</text>
      <text x="76" y="119">search the canvas</text>
    </g>
    <g transform="translate(860,500)" font-size="16">
      <text font-size="14" font-weight="700" fill="#9a8f83" letter-spacing="1">AUTOMATIC</text>
      <text y="34">• Edges and layout for every new node</text>
      <text y="62">• Nodes grow and shrink with their text</text>
      <text y="90">• Tidy: re-layout all trees, no crossings</text>
      <text y="118">• Copy image nodes to the clipboard</text>
      <text y="146">• Pasted images renamed after the canvas</text>
    </g>
  </g>
</svg>
